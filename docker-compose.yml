services:
  memsave:
    build:
      context: .
      args:
        MEMSAVE_COMMIT: ${MEMSAVE_COMMIT:-}
        MEMSAVE_COMMIT_DATE: ${MEMSAVE_COMMIT_DATE:-}
        MEMSAVE_VERSION: ${MEMSAVE_VERSION:-1.0.0}
        MEMSAVE_CREATED: ${MEMSAVE_CREATED:-}
    image: memsave:latest
    container_name: memsave
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEMSAVE_PORT:-8780}:8780"
      - "${MEMSAVE_BIND_ADDR:-10.77.77.21}:${MEMSAVE_PORT:-8780}:8780"
    environment:
      HOST: 0.0.0.0
      PORT: 8780
      MEMSAVE_DATA_DIR: /data
      MEMSAVE_VISION_API_KEY: ${MEMSAVE_VISION_API_KEY:-}
      MEMSAVE_VISION_MODEL: ${MEMSAVE_VISION_MODEL:-deepseek/deepseek-v4.1-flash}
      MEMSAVE_VISION_BASE_URL: ${MEMSAVE_VISION_BASE_URL:-https://openrouter.ai/api/v1}
      MEMSAVE_VISION_TIMEOUT: ${MEMSAVE_VISION_TIMEOUT:-60}
      MEMSAVE_REPO_URL: ${MEMSAVE_REPO_URL:-https://github.com/northis/memsave}
    volumes:
      - "${MEMSAVE_HOST_DATA_DIR:-./data}:/data"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

